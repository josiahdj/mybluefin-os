---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: mybluefin-os
# description will be included in the image's metadata
description: This is my personal Bluefin OS dx image, with Chrome and 1Password.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx-nvidia
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0

  # Not using the "bling" module's 1password installer here: it hardcodes
  # /opt/1Password/resources/1password.desktop, which the 1Password RPM
  # renamed to com.onepassword.OnePassword.desktop as of 8.12.x, breaking
  # the build. The RPM already installs desktop entries/icons directly to
  # /usr/share/applications and /usr/share/icons, so this script does the
  # same setup (repo, GIDs, setuid/setgid bits) without that broken step.
  - type: script
    scripts:
      - install-1password.sh # install 1Password (stable) and `op` CLI tool

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: script
    scripts:
      - enable-chrome-yum-repo.sh

  - type: rpm-ostree
    install:
      - google-chrome-stable
    optfix:
      - google

  - type: dnf
    repos:
      copr:
        #- principis/howdy-beta
        - starfish/howdy-beta
        - scottames/ghostty
    install:
      packages:
        - howdy
        - howdy-gtk
        - ghostty

  # The scottames/ghostty COPR build above doesn't vendor ghostty's upstream
  # theme set, so /usr/share/ghostty/themes never gets created and any
  # `theme = <name>` config value is unresolvable. This fetches it ourselves.
  - type: script
    scripts:
      - install-ghostty-themes.sh

  # Not installing selinux-policy-devel: it hard-requires an exact-version
  # match to the selinux-policy build already pinned in the base image
  # (currently 42.13-1.fc42), and that specific build's RPM has been pruned
  # from Fedora's updates-archive mirror (repodata still lists it, but the
  # file 404s), which breaks resolution. It's also unneeded here:
  # install-howdy-selinux.sh already falls back to the raw checkmodule +
  # semodule_package toolchain (from checkpolicy/policycoreutils below) when
  # /usr/share/selinux/devel/Makefile isn't present.
  - type: rpm-ostree
    install:
      - policycoreutils
      - selinux-policy-targeted
      - checkpolicy
      - policycoreutils-python-utils

  # Copies files/system/* into the image root. This is what ships
  # howdy-selinux-install.service (and its multi-user.target.wants symlink),
  # which loads the howdy_gdm SELinux module at boot, and the udev rule that
  # gives each camera interface a stable by-id link (see docs/howdy/README.md).
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - install-howdy-selinux.sh
      - configure-howdy.sh